# =============================================================================
# .github/workflows/validate.yml — Quality gate
#
# Purpose:  Run exactly the same checks as scripts/gate.sh, by calling exactly
#           the same scripts (INV-7). This workflow deliberately contains no
#           check logic of its own — a re-implementation here is how local and
#           CI drift apart, which is what the 2026-08-11 review found.
# Changes:  Nothing — read-only, fails on violations
# Usage:    Automatically on push/pull_request to main; callable by release.yml
# =============================================================================
name: Validate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  # release.yml calls this workflow before cutting a release. Without
  # workflow_call the reusable-workflow reference fails to start at all.
  workflow_call:

permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Quality gate
    runs-on: macos-latest
    timeout-minutes: 20

    steps:
      # Full history: the secret scan reads history, not just the worktree.
      # Pinned to a commit SHA, not a moving tag: a tag can be repointed at new
      # code by whoever controls the action's repo, and this workflow runs on
      # every push to a public repo.
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # The gate treats a missing tool as a failure rather than a skip, so the
      # dependencies are installed without `|| true`: if this step cannot
      # complete, the run must stop here rather than continue into a gate that
      # reports "cannot run" for half its checks.
      - name: Install declared dependencies
        run: brew install shellcheck yq jq gitleaks

      # One step, one source of truth. Everything the gate checks is checked
      # here, in the same order, by the same code.
      - name: Hard gate
        run: ./scripts/gate.sh

      # Proves the gate still blocks: a deliberately broken tree must produce
      # GATE: FAIL, and a failure in an early check must not stop the later
      # security checks from running (INV-6).
      - name: Gate self-test
        run: ./scripts/checks/self-test.sh
