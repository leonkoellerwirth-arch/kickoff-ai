# =============================================================================
# .github/workflows/up2date.yml — Weekly currency check
#
# Purpose:  Checks all registry entries against upstream weekly,
#           writes updated versions as a pull request,
#           opens issues for sunset candidates and review due items.
# Changes:  Writes PR with version_seen/reviewed/STATE.json changes.
#           Opens/updates an issue for findings.
#           NEVER changes: status, installed software.
# Requires: GITHUB_TOKEN (provided automatically), optional GH_TOKEN for
#           higher rate limits on the GitHub release check.
# Usage:    schedule (Monday 08:00 UTC) or manually via workflow_dispatch
#
# Two rules this file must keep (both were violated until 2026-08-11):
#
#   1. No blanket `|| true`. up2date exits 0 (clean), 1 (drift) or 2 (the check
#      could not complete). Only 0 and 1 may continue. Swallowing 2 turns "the
#      currency check is broken" into "nothing to report", which defeats the
#      entire point of the tool.
#   2. No ${{ }} interpolation inside a run: block. Expression values are
#      passed through env: and referenced as shell variables, so a value can
#      never become shell syntax. See release.yml for the same rule.
#
# Why peter-evans/create-pull-request instead of gh CLI:
#   The action handles branch management and PR deduplication;
#   with multiple weekly runs without a merge the same branch/PR is updated
#   instead of creating duplicates. The gh CLI would require more complex
#   shell logic for that.
# =============================================================================
name: up2date

on:
  schedule:
    # Monday 08:00 UTC
    - cron: "0 8 * * 1"
  workflow_dispatch:
    inputs:
      level:
        description: "Only entries from level (0-3, default: all)"
        required: false
        default: ""
        type: string
      dry_run:
        description: "Dry run (no PR, no issue)"
        required: false
        default: "false"
        type: boolean

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: up2date
  cancel-in-progress: false

jobs:
  check:
    name: Currency check
    runs-on: macos-latest
    timeout-minutes: 30

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout (full, for PR creation)
      # -----------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # -----------------------------------------------------------------------
      # 2. Install dependencies
      #    No `|| true`: a half-installed toolchain must stop the run, not
      #    produce a check that silently cannot reach anything.
      # -----------------------------------------------------------------------
      - name: Install dependencies
        run: brew install yq jq shellcheck

      # -----------------------------------------------------------------------
      # 3. Upstream check (JSON + Markdown report)
      # -----------------------------------------------------------------------
      - name: Upstream check
        id: check
        env:
          CI: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Interpolated here, not in the script body: a crafted dispatch input
          # would otherwise be pasted into the shell before it runs.
          INPUT_LEVEL: ${{ inputs.level }}
        run: |
          set -euo pipefail

          level_flag=""
          if [ -n "${INPUT_LEVEL:-}" ]; then
            case "$INPUT_LEVEL" in
              0|1|2|3) level_flag="--level $INPUT_LEVEL" ;;
              *) echo "::error::level must be 0-3, got: $INPUT_LEVEL"; exit 1 ;;
            esac
          fi

          run_up2date() {
            set +e
            # shellcheck disable=SC2086
            automation/bin/up2date check $level_flag "$1" > "$2"
            rc=$?
            set -e
            case "$rc" in
              0|1) return 0 ;;
              *)
                echo "::error::up2date could not complete the check (exit $rc)."
                echo "::error::Exit 2 means entries were unreachable — this is NOT 'no drift'."
                return 1
                ;;
            esac
          }

          run_up2date --json /tmp/up2date-result.json
          run_up2date --markdown /tmp/up2date-report.md

          # The result must be parseable before anything downstream trusts it.
          if ! jq -e 'type == "array"' /tmp/up2date-result.json > /dev/null 2>&1; then
            echo "::error::up2date did not emit a valid JSON array"
            head -c 2000 /tmp/up2date-result.json || true
            exit 1
          fi

          updates=$(jq '[.[] | select(.category == "update")] | length' /tmp/up2date-result.json)
          sunsets=$(jq '[.[] | select(.category == "sunset")] | length' /tmp/up2date-result.json)
          reviews=$(jq '[.[] | select(.category == "review")] | length' /tmp/up2date-result.json)
          total=$((updates + sunsets + reviews))

          {
            echo "updates=$updates"
            echo "sunsets=$sunsets"
            echo "reviews=$reviews"
            echo "total=$total"
          } >> "$GITHUB_OUTPUT"

          echo "Findings: $updates updates, $sunsets sunset candidates, $reviews review due"

      # -----------------------------------------------------------------------
      # 4. Write back versions
      #    Runs only because step 3 succeeded, i.e. the check was complete.
      # -----------------------------------------------------------------------
      - name: Write back versions (--apply-versions)
        env:
          CI: "1"
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          automation/bin/up2date --apply-versions

      # -----------------------------------------------------------------------
      # 5. Pull request for version updates
      #    Branch: chore/up2date-<run id>
      #    Only when tools.yaml or STATE.json have changed
      # -----------------------------------------------------------------------
      - name: Create pull request (version update)
        if: inputs.dry_run != 'true'
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          commit-message: "chore: version update via up2date (${{ github.run_id }})"
          branch: chore/up2date-${{ github.run_id }}
          delete-branch: true
          title: "chore: weekly version update (up2date)"
          body: |
            ## Automated version update

            This PR was created by `.github/workflows/up2date.yml`.
            It contains only changes to `version_seen`, `reviewed`, and `STATE.json`.
            **No `status` was changed. No software was installed or uninstalled.**

            ${{ steps.check.outputs.updates }} updates available.

            ---
            *Generated by `automation/bin/up2date --apply-versions`*
          labels: "chore,automated"
          add-paths: |
            manifests/tools.yaml
            manifests/STATE.json

      # -----------------------------------------------------------------------
      # 6. Issue for sunset candidates and review due items
      #    Fixed identifier in title prevents duplicates
      # -----------------------------------------------------------------------
      - name: Create/update issue (sunset + review)
        if: |
          inputs.dry_run != 'true' &&
          (steps.check.outputs.sunsets > 0 || steps.check.outputs.reviews > 0)
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SUNSETS: ${{ steps.check.outputs.sunsets }}
          REVIEWS: ${{ steps.check.outputs.reviews }}
        run: |
          set -euo pipefail

          issue_title="up2date: action required — sunset candidates & review due"
          issue_label="up2date"

          # The body is assembled in a file, never in a shell string that the
          # report content could break out of.
          body_file="$(mktemp)"
          {
            echo "## up2date — action required"
            echo
            echo "**Date:** $(date +%Y-%m-%d)"
            echo "**Sunset candidates:** ${SUNSETS}"
            echo "**Review due:** ${REVIEWS}"
            echo
            echo "These items require a human decision."
            echo "Status changes are NOT made automatically."
            echo
            echo "### Recommended commands"
            echo
            echo '```bash'
            echo "automation/bin/sunset list --due"
            echo "automation/bin/sunset propose <id> --reason \"reason\""
            echo "automation/bin/sunset confirm <id>"
            echo '```'
            echo
            echo "### Full report"
            echo
            cat /tmp/up2date-report.md 2>/dev/null || echo "_Report not available._"
            echo
            echo "---"
            echo "*Generated by \`.github/workflows/up2date.yml\`*"
          } > "$body_file"

          existing_issue=$(gh issue list \
            --label "$issue_label" \
            --state open \
            --json number,title \
            --jq ".[] | select(.title == \"$issue_title\") | .number" \
            2>/dev/null | head -1 || echo "")

          if [ -n "$existing_issue" ]; then
            gh issue comment "$existing_issue" --body-file "$body_file"
            echo "Issue #$existing_issue updated"
          else
            gh label create "$issue_label" --color "0075ca" \
              --description "up2date automation" 2>/dev/null || true
            gh issue create \
              --title "$issue_title" \
              --body-file "$body_file" \
              --label "$issue_label"
            echo "New issue created"
          fi
