# =============================================================================
# .github/workflows/release.yml — Versioning and GitHub release
#
# Purpose:  Creates a GitHub release on a v* tag. Uses the [Unreleased]
#           section from CHANGELOG.md as release notes.
#           Runs validate as a prerequisite.
# Changes:  Creates GitHub release (no code changes)
# Usage:    git tag v0.2.0 && git push origin v0.2.0
#
# Versioning semantics for this repo:
#   MAJOR  Setup no longer backwards-compatibly reproducible
#          (level cut changed, module removed, Brewfile structure broken)
#   MINOR  Tool added or module extended (new script, new category)
#   PATCH  Versions bumped, documentation, bugfixes, consistency fixes
# =============================================================================
name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  validate:
    name: Pre-release validation
    uses: ./.github/workflows/validate.yml
    permissions:
      contents: read

  release:
    name: Create GitHub release
    runs-on: macos-latest
    needs: validate
    timeout-minutes: 10

    steps:
      # -----------------------------------------------------------------------
      # 1. Checkout
      # -----------------------------------------------------------------------
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      # -----------------------------------------------------------------------
      # 2. Extract and verify version from tag
      # -----------------------------------------------------------------------
      - name: Check version
        id: version
        run: |
          tag="${GITHUB_REF#refs/tags/}"
          version="${tag#v}"

          echo "Tag: $tag"
          echo "Version: $version"

          # VERSION file must match the tag
          if [ -f VERSION ]; then
            file_version=$(cat VERSION | tr -d '[:space:]')
            if [ "$file_version" != "$version" ]; then
              echo "ERROR: VERSION file ($file_version) does not match tag ($version)"
              exit 1
            fi
          fi

          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"

      # -----------------------------------------------------------------------
      # 3. Extract release notes from CHANGELOG.md
      # -----------------------------------------------------------------------
      # The notes go to a FILE and never through a step output.
      #
      # Two separate injection paths existed here, both driven by ordinary
      # CHANGELOG content that any contributor can propose:
      #
      #   1. The next step interpolated ${{ steps.notes.outputs.notes }} inside
      #      a double-quoted shell argument, in a job holding contents: write.
      #      A quote or a $(...) in the changelog became shell syntax before the
      #      script ran.
      #   2. The heredoc delimiter written into $GITHUB_OUTPUT was the fixed
      #      string EOFNOTES. A changelog line containing EOFNOTES closes the
      #      block early and lets the rest of the section set arbitrary step
      #      outputs.
      #
      # A file has neither property: content is copied, never evaluated.
      - name: Extract release notes from CHANGELOG.md
        env:
          # Through env:, never interpolated into the script body.
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          notes_file=/tmp/release-notes.md

          if [ ! -f CHANGELOG.md ]; then
            echo "No CHANGELOG.md found — using empty release notes"
            echo "_No changelog available._" > "$notes_file"
            exit 0
          fi

          # Read the section for THIS version, e.g. "## [0.2.0] — 2026-08-11".
          # Reading [Unreleased] instead only works if the changelog has not been
          # rolled over yet — which is exactly what you do just before tagging,
          # so it produced empty notes for every properly prepared release.
          extract() {
            awk -v want="$1" '
              $0 ~ "^## \\[" want "\\]" { in_section = 1; next }
              in_section && /^## \[/ { exit }
              in_section { print }
            ' CHANGELOG.md | sed '/^[[:space:]]*$/d' | head -200
          }

          extract "$VERSION" > "$notes_file"

          # Fall back to [Unreleased] for a tag cut without rolling the changelog.
          if [ ! -s "$notes_file" ]; then
            echo "No [$VERSION] section — falling back to [Unreleased]"
            extract "Unreleased" > "$notes_file"
          fi

          if [ ! -s "$notes_file" ]; then
            echo "_No changelog entries for this release._" > "$notes_file"
          fi

          echo "Release notes prepared ($(wc -l < "$notes_file" | tr -d ' ') lines)"

      # -----------------------------------------------------------------------
      # 4. Create GitHub release
      # -----------------------------------------------------------------------
      - name: Create GitHub release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Through env:, not interpolated into the script body. The tag is
          # attacker-influenced in the same way the changelog was — anyone who
          # can push a tag chooses this string.
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail

          notes_file=/tmp/release-notes.md

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — updating"
            gh release edit "$TAG" \
              --title "kickoff-ai $TAG" \
              --notes-file "$notes_file"
          else
            gh release create "$TAG" \
              --title "kickoff-ai $TAG" \
              --notes-file "$notes_file" \
              --verify-tag
          fi

          echo "Release $TAG created/updated"
